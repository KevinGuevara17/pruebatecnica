<!-- catalog/templates/registration/login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Asegúrate de que este enlace a Tailwind esté funcionando en tu proyecto Django -->
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body class="bg-[#00000c] text-zinc-100 flex items-center justify-center min-h-screen relative overflow-hidden font-sans antialiased">
    
    <!-- Elementos de fondo Bokeh (sutiles degradados radiales) -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-[radial-gradient(circle_at_center,rgba(0,192,255,0.1),transparent_70%)] blur-3xl"></div>
        <div class="absolute -bottom-60 -right-20 w-[600px] h-[600px] rounded-full bg-[radial-gradient(circle_at_center,rgba(130,0,255,0.06),transparent_70%)] blur-3xl"></div>
        <div class="absolute top-1/2 left-1/4 w-80 h-80 rounded-full bg-[radial-gradient(circle_at_center,rgba(255,0,130,0.05),transparent_70%)] blur-3xl"></div>
    </div>

    <!-- Contenedor del Formulario (Centrado) -->
    <div class="relative z-10 bg-[#0e0e2e]/90 p-10 rounded-2xl w-full max-w-md border border-cyan-900/50 backdrop-blur-sm shadow-[0_0_30px_rgba(0,192,255,0.08)]">
        
        <!-- Encabezado del Formulario -->
        <div class="text-center mb-10">
            <!-- Simulación de logo de Finara -->
            <div class="inline-block text-3xl font-extrabold text-white mb-1">
                <span class="font-serif">Goya</span>
            </div>
            <p class="text-xs uppercase tracking-widest text-cyan-400 font-semibold">Acceso Exclusivo Goya</p>
            <p class="mt-2 text-sm text-zinc-400">Inicia sesión para continuar en la plataforma Goya.</p>
        </div>
        
        <!-- Formulario Django -->
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <!-- Manejo de Errores -->
            {% if form.errors %}
                <div class="bg-red-950/50 border border-red-700 text-red-200 text-sm p-3 rounded-lg text-center" role="alert">
                    <strong class="font-bold">Error:</strong>
                    <span class="block sm:inline">Usuario o contraseña incorrectos.</span>
                </div>
            {% endif %}

            <!-- Campo Usuario -->
            <div>
                <label for="id_username" class="block text-xs uppercase tracking-wider font-semibold text-zinc-300 mb-2">Usuario</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-zinc-500">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </span>
                    <input type="text" name="username" id="id_username" required placeholder="tu_usuario@finara.com"
                           class="mt-1 block w-full px-4 py-3 pl-11 border border-zinc-700 rounded-lg bg-[#05051a] text-white placeholder:text-zinc-600 shadow-inner focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-colors">
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div>
                <label for="id_password" class="block text-xs uppercase tracking-wider font-semibold text-zinc-300 mb-2">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-zinc-500">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </span>
                    <input type="password" name="password" id="id_password" required placeholder="••••••••••••"
                           class="mt-1 block w-full px-4 py-3 pl-11 border border-zinc-700 rounded-lg bg-[#05051a] text-white placeholder:text-zinc-600 shadow-inner focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-colors">
                    <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-zinc-500 hover:text-cyan-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" 
                    class="w-full flex justify-center items-center py-3 px-6 border border-transparent rounded-lg shadow-lg text-sm uppercase tracking-widest font-bold text-white bg-indigo-700 hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-150 transform hover:scale-[1.01] active:scale-[0.99] focus:ring-offset-[#0e0e2e]">
                Iniciar Sesión
            </button>
        </form>
        
        <!-- Enlaces Adicionales (Opcionales) -->
        <div class="mt-8 pt-6 border-t border-zinc-800 text-center space-y-2">
            <a href="#" class="block text-xs text-zinc-500 hover:text-cyan-400 transition-colors">Olvidé mi contraseña</a>
            <a href="#" class="block text-xs text-zinc-500 hover:text-cyan-400 transition-colors">Registrar nuevo usuario</a>
        </div>
    </div>
</body>
</html>
